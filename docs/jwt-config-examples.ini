# JWT Authentication Example Configuration
#
# This file demonstrates how to configure JWT authentication in Gitea.
# Copy the relevant sections to your app.ini file.

###############################################################################
# Example 1: Basic JWT Authentication with Keycloak
###############################################################################
[jwt]
ENABLED = true
HEADER_NAME = Authorization
JWKS_URL = https://keycloak.example.com/realms/your-realm/protocol/openid-connect/certs
ISSUER = https://keycloak.example.com/realms/your-realm
AUDIENCE = gitea
USERNAME_CLAIM = preferred_username
ROLES_CLAIM = roles

###############################################################################
# Example 2: JWT with Auth0
###############################################################################
#[jwt]
#ENABLED = true
#HEADER_NAME = Authorization
#JWKS_URL = https://your-tenant.auth0.com/.well-known/jwks.json
#ISSUER = https://your-tenant.auth0.com/
#AUDIENCE = your-api-identifier
#USERNAME_CLAIM = email
#ROLES_CLAIM = https://your-app/roles

###############################################################################
# Example 3: JWT with Azure AD (Microsoft Entra ID)
###############################################################################
#[jwt]
#ENABLED = true
#HEADER_NAME = Authorization
#JWKS_URL = https://login.microsoftonline.com/common/discovery/v2.0/keys
#ISSUER = https://login.microsoftonline.com/{your-tenant-id}/v2.0
#AUDIENCE = api://your-application-id
#USERNAME_CLAIM = preferred_username
#ROLES_CLAIM = roles

###############################################################################
# Example 4: Reverse Proxy with Custom JWT Header
# Use this when your reverse proxy adds JWT tokens in a custom header
###############################################################################
#[jwt]
#ENABLED = true
#HEADER_NAME = X-JWT-Token
#JWKS_URL = https://your-idp.example.com/.well-known/jwks.json
#SKIP_ISSUER_CHECK = true
#SKIP_AUDIENCE_CHECK = true
#USERNAME_CLAIM = sub
#ROLES_CLAIM = groups

###############################################################################
# Example 5: JWT with Multiple Audiences
###############################################################################
#[jwt]
#ENABLED = true
#HEADER_NAME = Authorization
#JWKS_URL = https://your-idp.example.com/.well-known/jwks.json
#ISSUER = https://your-idp.example.com
#AUDIENCE = gitea,api,webapp
#USERNAME_CLAIM = preferred_username
#ROLES_CLAIM = roles

###############################################################################
# Example 6: JWT with Nested Claims
# Some identity providers use nested claim structures
###############################################################################
#[jwt]
#ENABLED = true
#HEADER_NAME = Authorization
#JWKS_URL = https://your-idp.example.com/.well-known/jwks.json
#ISSUER = https://your-idp.example.com
#AUDIENCE = gitea
#USERNAME_CLAIM = user.username
#ROLES_CLAIM = user.groups

###############################################################################
# Configuration Options Reference
###############################################################################
# ENABLED (boolean, default: false)
#   Enable or disable JWT authentication
#
# HEADER_NAME (string, default: "Authorization")
#   HTTP header name containing the JWT token
#   Common values: Authorization, X-JWT-Token, X-Forwarded-Access-Token
#
# JWKS_URL (string, REQUIRED when enabled)
#   URL to fetch JSON Web Key Set (JWKS) for token validation
#   Example: https://your-idp.com/.well-known/jwks.json
#
# ISSUER (string, default: "gitea")
#   Expected JWT issuer (iss claim)
#   Set SKIP_ISSUER_CHECK = true to skip validation
#
# AUDIENCE (string list, default: "gitea")
#   Expected JWT audience (aud claim)
#   Multiple audiences can be comma-separated
#   Set SKIP_AUDIENCE_CHECK = true to skip validation
#
# SKIP_ISSUER_CHECK (boolean, default: false)
#   Skip issuer validation - useful for multi-issuer setups
#
# SKIP_AUDIENCE_CHECK (boolean, default: false)
#   Skip audience validation
#
# USERNAME_CLAIM (string, default: "preferred_username")
#   JWT claim path containing the username
#   Common values: sub, preferred_username, email, username, name
#   Supports nested paths with dots: user.username
#   Falls back to: preferred_username, sub, email, username, name
#
# ROLES_CLAIM (string, default: "roles")
#   JWT claim path containing user roles/groups
#   Common values: roles, groups, authorities
#   Supports nested paths with dots: user.roles
#   Can be array or comma-separated string

###############################################################################
# Security Notes
###############################################################################
# 1. Always use HTTPS in production
# 2. Ensure JWKS_URL is accessible from Gitea server
# 3. Users must exist in Gitea - JWT auth does NOT auto-create users
# 4. Public keys are cached for 1 hour
# 5. Tokens are validated for signature, expiration, issuer, and audience
# 6. When using custom headers, ensure your reverse proxy strips them from
#    external requests to prevent header injection attacks
